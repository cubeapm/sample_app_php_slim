version: '3'
services:
  slim:
    build:
      context: . 
    container_name: cube_php_slim
    ports:
      - "8000:8000"  
  mysql:
    image: mysql:8.0
    container_name: cube_php_slim_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
    volumes:
      - cube_php_slim_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine3.18
    container_name: cube_php_slim_redis

volumes:
    cube_php_slim_mysql:
    