version: '3'
services:
  slim:
    platform: linux/amd64
    build:
      context: . 
    container_name: cube_php_slim
    environment:
      - PHP_CLI_SERVER_WORKERS=4

      - OTEL_SERVICE_NAME=cube_sample_php_slim_otel
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip 
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_PHP_AUTOLOAD_ENABLED=true 
      - OTEL_PROPAGATORS=baggage,tracecontext 

      # optional settings
      - OTEL_RESOURCE_ATTRIBUTES=cube.environment=UNSET,service.version=1.2.3,mykey1=myvalue1,mykey2=myvalue2

      # print traces on console
      - OTEL_TRACES_EXPORTER=console
      - OTEL_LOG_LEVEL=debug
      # send traces to CubeAPM
      # - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://host.docker.internal:4318/v1/traces 
    ports:
      - "8000:80"  
    depends_on:
      - mysql
      - redis
    restart: always
  
  mysql:
    image: mysql:8.0
    container_name: cube_php_slim_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
    volumes:
      - cube_php_slim_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine3.18
    container_name: cube_php_slim_redis

volumes:
    cube_php_slim_mysql:
    